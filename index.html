<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema Solar</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #cfd6e4; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud {
    position: fixed; top: 12px; left: 12px; padding: 10px 12px; min-width: 190px;
    background: rgba(10, 14, 24, .62); border: 1px solid rgba(160, 180, 220, .18);
    border-radius: 8px; font-size: 12px; line-height: 1.4; backdrop-filter: blur(4px);
    user-select: none;
  }
  #hud .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #hud b { font-weight: 600; color: #e8edf8; }
  .bar { height: 3px; margin: 6px 0 8px; background: rgba(160, 180, 220, .2); border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: #7fa6e6; }
  #hud button {
    background: rgba(120, 150, 210, .18); color: #dbe4f6; border: 1px solid rgba(160, 180, 220, .3);
    border-radius: 5px; padding: 3px 10px; font: inherit; cursor: pointer;
  }
  #hud button:hover { background: rgba(120, 150, 210, .32); }
  #sel { display: none; margin: 0 0 8px; }
  #sel .row b:last-child { color: #f0c37a; }
  #hud input[type=range] { width: 100%; margin: 6px 0 0; accent-color: #7fa6e6; }
  .pbtn {
    background: rgba(120, 150, 210, .18); color: #dbe4f6; border: 1px solid rgba(160, 180, 220, .3);
    border-radius: 5px; padding: 3px 10px; font: inherit; cursor: pointer;
  }
  .pbtn:hover { background: rgba(120, 150, 210, .32); }
  #fleet {
    position: fixed; top: 12px; right: 12px; width: 290px; max-width: calc(100vw - 24px); max-height: calc(100% - 72px);
    display: flex; flex-direction: column; z-index: 4; font-size: 12px; line-height: 1.4;
    background: rgba(10, 14, 24, .72); border: 1px solid rgba(160, 180, 220, .18); border-radius: 8px; backdrop-filter: blur(4px);
  }
  #fleetToggle { margin: 8px; text-align: left; }
  #fleetBody { display: none; padding: 0 10px 10px; overflow-y: auto; }
  #fleet.open #fleetBody { display: block; }
  #fleet .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; cursor: pointer; }
  #sagaChecks { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 8px; }
  #sagaChecks label { cursor: pointer; }
  #shipSearch {
    width: 100%; box-sizing: border-box; padding: 5px 8px; font: inherit; color: #e8edf8; background: rgba(0, 0, 0, .35);
    border: 1px solid rgba(160, 180, 220, .25); border-radius: 5px; outline: none;
  }
  #shipSearch:focus { border-color: #7fa6e6; }
  .saga h4 { margin: 12px 0 2px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #8fa1c4; }
  .srow { padding: 6px 0; border-top: 1px solid rgba(160, 180, 220, .1); }
  .srow .sname { display: flex; align-items: center; gap: 6px; color: #e8edf8; }
  .srow .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .srow .smeta { margin-left: 14px; color: #7f8db0; font-size: 11px; }
  .srow .sstat { margin: 2px 0 4px 14px; color: #a9b6d2; font-size: 11px; min-height: 15px; }
  .srow .sbtns { margin-left: 14px; display: flex; gap: 6px; }
  .srow .sbtns .pbtn { padding: 2px 8px; font-size: 11px; }
  [hidden] { display: none !important; }
  #hud select { background: rgba(0, 0, 0, .4); color: #dbe4f6; border: 1px solid rgba(160, 180, 220, .3); border-radius: 5px; padding: 2px 6px; font: inherit; }
  /* --- Botón y formulario de contacto: estética «Matrix» --- */
  #contact {
    position: fixed; right: 12px; bottom: 12px; z-index: 6; cursor: pointer; padding: 9px 14px;
    font: 600 13px/1 "Courier New", Consolas, monospace; letter-spacing: .04em; color: #00ff41; background: rgba(0, 18, 4, .88);
    border: 1px solid #00ff41; border-radius: 3px; text-shadow: 0 0 6px rgba(0, 255, 65, .8); box-shadow: 0 0 12px rgba(0, 255, 65, .35), inset 0 0 10px rgba(0, 255, 65, .12);
    transition: background .15s, color .15s, box-shadow .15s;
  }
  #contact:hover, #contact:focus-visible { background: #00ff41; color: #001a05; text-shadow: none; box-shadow: 0 0 22px rgba(0, 255, 65, .75); outline: none; }
  #contact .cur { display: inline-block; animation: mxblink 1s steps(2) infinite; }
  @keyframes mxblink { 50% { opacity: 0; } }
  #contactModal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 6, 0, .78); }
  #contactModal .cbox { position: relative; width: min(460px, 100%); max-height: 100%; overflow: auto; background: #000; border: 1px solid #00ff41; border-radius: 4px; box-shadow: 0 0 30px rgba(0, 255, 65, .45); font-family: "Courier New", Consolas, monospace; color: #00ff41; }
  #contactModal #rain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .28; pointer-events: none; }
  #contactModal .cin { position: relative; padding: 18px 18px 16px; }
  #contactModal h2 { margin: 0 28px 4px 0; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 0 8px rgba(0, 255, 65, .9); }
  #contactModal .cnote { margin: 0 0 12px; font-size: 12px; color: #4dcc6e; }
  #contactModal #cClose { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: #00ff41; font: 22px/1 "Courier New", monospace; cursor: pointer; }
  #contactModal label { display: block; margin-top: 10px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  #contactModal input:not(.hp), #contactModal textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px 9px; font: 14px "Courier New", Consolas, monospace; color: #00ff41; caret-color: #00ff41; background: rgba(0, 12, 2, .9); border: 1px solid #0a7a24; border-radius: 3px; outline: none; resize: vertical; }
  #contactModal input:not(.hp):focus, #contactModal textarea:focus { border-color: #00ff41; box-shadow: 0 0 10px rgba(0, 255, 65, .5); }
  #contactModal [aria-invalid="true"] { border-color: #ff5f5f !important; }
  #contactModal .cerr { min-height: 14px; margin-top: 3px; font-size: 11px; color: #ff7b7b; text-transform: none; letter-spacing: 0; }
  #contactModal .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  #contactModal #cStatus { min-height: 16px; margin-top: 8px; font-size: 12px; }
  #contactModal #cStatus a { color: #00ff41; }
  #contactModal .cbtns { display: flex; gap: 10px; margin-top: 10px; }
  #contactModal .cbtns button { flex: 1; padding: 9px 10px; font: 600 13px "Courier New", Consolas, monospace; letter-spacing: .05em; cursor: pointer; color: #00ff41; background: rgba(0, 18, 4, .9); border: 1px solid #00ff41; border-radius: 3px; }
  #contactModal .cbtns button:hover:not(:disabled), #contactModal .cbtns button:focus-visible { background: #00ff41; color: #001a05; outline: none; }
  #contactModal .cbtns button:disabled { opacity: .55; cursor: default; }
  #contactModal .cpriv { margin: 10px 0 0; font-size: 10.5px; color: #3a9c55; }
  #hint { position: fixed; bottom: 10px; left: 12px; max-width: calc(100vw - 260px); font-size: 11px; color: rgba(190, 200, 225, .45); pointer-events: none; }
  #tip {
    position: fixed; left: 0; top: 0; display: none; pointer-events: none; z-index: 5;
    padding: 3px 8px; font-size: 12px; color: #fff; background: rgba(8, 12, 22, .85);
    border: 1px solid rgba(160, 180, 220, .35); border-radius: 5px; white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud">
  <div class="row"><span><span data-i18n="year"></span> <b id="year">1</b></span><button id="play" data-i18n-title="pause_title"></button></div>
  <div style="margin-top:4px"><span data-i18n="lap"></span> <b id="lap">0%</b></div>
  <div class="bar"><i id="barfill"></i></div>
  <div id="sel">
    <div class="row"><span id="selname">—</span><b id="sellap">0%</b></div>
    <div class="bar" style="margin-bottom:0"><i id="selfill" style="background:#f0c37a"></i></div>
  </div>
  <div class="row"><span data-i18n="speed"></span><b id="spdlbl">x1</b></div>
  <input id="speed" type="range" min="-2" max="2" step="0.05" value="0" data-i18n-aria="speed">
  <div class="row" style="margin-top:8px"><span data-i18n="light"></span><b id="lightlbl">100%</b></div>
  <input id="light" type="range" min="0" max="200" step="5" value="100" data-i18n-aria="light">
  <label class="row" style="margin-top:8px;cursor:pointer"><span data-i18n="trails"></span><input type="checkbox" id="trailchk" checked></label>
  <label class="row" style="margin-top:8px;cursor:pointer"><span data-i18n="orbits"></span><input type="checkbox" id="orbitchk" checked></label>
  <div class="row" style="margin-top:8px"><span data-i18n="language"></span><select id="lang" aria-label="Idioma / Language"><option value="es">Español</option><option value="en">English</option></select></div>
</div>
<aside id="fleet">
  <button id="fleetToggle" class="pbtn" aria-expanded="false">🛸 <span data-i18n="ships"></span></button>
  <div id="fleetBody">
    <label class="row"><span data-i18n="show_ships"></span><input type="checkbox" id="shipsMaster" checked></label>
    <div id="sagaChecks">
      <label><input type="checkbox" data-saga="sw" checked> Star Wars</label>
      <label><input type="checkbox" data-saga="st" checked> Star Trek</label>
      <label><input type="checkbox" data-saga="otras" checked> <span data-i18n="others"></span></label>
    </div>
    <input id="shipSearch" type="search" data-i18n-ph="search_ph" data-i18n-aria="search_ph">
    <div id="shipList"></div>
  </div>
</aside>
<div id="hint" data-i18n="hint"></div>
<button id="contact" type="button"><span class="cur">&gt;_</span> <span data-i18n="contact_btn"></span></button>
<div id="contactModal" role="dialog" aria-modal="true" aria-labelledby="cTitle" hidden>
  <div class="cbox">
    <canvas id="rain" aria-hidden="true"></canvas>
    <div class="cin">
      <button type="button" id="cClose" data-i18n-aria="close">×</button>
      <h2 id="cTitle" data-i18n="contact_title"></h2>
      <p class="cnote" data-i18n="contact_note"></p>
      <form id="cForm" novalidate autocomplete="on">
        <label>* <span data-i18n="f_name"></span><input id="cName" name="name" required maxlength="80" autocomplete="name"></label><div class="cerr" id="eName"></div>
        <label>* <span data-i18n="f_mail"></span><input id="cMail" name="email" type="email" required maxlength="120" autocomplete="email" inputmode="email"></label><div class="cerr" id="eMail"></div>
        <label>* <span data-i18n="f_msg"></span><textarea id="cMsg" name="message" required minlength="10" maxlength="2000" rows="5"></textarea></label><div class="cerr" id="eMsg"></div>
        <input class="hp" type="text" id="cHoney" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div id="cStatus" role="status" aria-live="polite"></div>
        <div class="cbtns"><button type="submit" id="cSend"></button><button type="button" id="cCancel"></button></div>
        <p class="cpriv" data-i18n="contact_priv"></p>
      </form>
    </div>
  </div>
</div>
<div id="tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";

/* =====================================================================
   DATOS DE LOS CUERPOS  (todo el escenario se genera desde este array)
   ---------------------------------------------------------------------
   ESCALAS (unidades de escena; el Sol está en el origen):
   - Distancia orbital:  a = 10 + 16·√(UA)   → raíz cuadrada de la distancia real
     (más un desplazamiento para que Mercurio no quede pegado al Sol).
     Mantiene el orden real y comprime Plutón (39,5 UA) a ~110 u.
   - Radios: exagerados y NO proporcionales a los reales; solo se respeta
     el orden: Júpiter > Saturno > Urano ≈ Neptuno > Tierra ≈ Venus > Marte > Mercurio.
   - Periodos planetarios: reales, en años terrestres (1 año = 60 s de reloj).
   - Lunas: radios orbitales y periodos (segundos reales por vuelta) COMPRIMIDOS,
     entre ~3 y 20 s, conservando el orden relativo de cada sistema.
     Los radios orbitales se mantienen menores que la separación al planeta vecino.
   - rotHours: periodo de rotación REAL en horas (negativo = retrógrado). Se escala con un
     único factor (ROT_SECONDS_PER_HOUR), así que las velocidades relativas son las reales:
     la Tierra gira en 12 s, Júpiter en ~5 s, Venus casi no se mueve (243 días reales).
   ===================================================================== */
const EARTH_YEAR_SECONDS = 60;
const TAU = Math.PI * 2;

/* =====================================================================
   IDIOMAS (es / en): textos de la interfaz, nombres de cuerpos y de naves
   ===================================================================== */
const STR = {
  es: { year: 'Año terrestre:', lap: 'Vuelta actual:', lap_n: 'vuelta', speed: 'Velocidad', light: 'Luz', trails: 'Estela en espiral', orbits: 'Órbitas', language: 'Idioma',
    pause: '⏸ Pausa', resume: '▶ Reanudar', pause_title: 'Pausa / reanudar (espacio)', ships: 'Naves', show_ships: 'Mostrar naves', others: 'Otras', search_ph: 'Buscar nave…',
    locate: 'Localizar', see: 'Ver', orbiting: 'Orbitando', traveling: 'Viajando de', to: 'a', parked: 'Estacionada (órbita lenta) cerca de', au_sun: 'UA del Sol',
    hint: 'Arrastrar: rotar · Rueda: zoom · Clic en planeta: ver su vuelta · Clic en nave: seguirla (Esc: soltar)',
    contact_btn: 'Contacta al equipo creador', contact_title: 'Contacta al equipo creador', contact_note: 'Todos los campos son obligatorios (*).',
    f_name: 'Nombre', f_mail: 'Mail', f_msg: 'Mensaje', send: 'Enviar', sending: 'Enviando…', cancel: 'Cancelar', close: 'Cerrar',
    err_name: 'Escribe tu nombre.', err_mail: 'Escribe un mail válido.', err_msg: 'El mensaje debe tener al menos 10 caracteres.',
    ok: 'Mensaje enviado. ¡Gracias, te responderemos pronto!', activate: 'El formulario aún no está activado: abre el mail de confirmación de FormSubmit (mira también spam y promociones), pulsa el enlace de activación y vuelve a enviar.', fail: 'No se pudo enviar. Inténtalo de nuevo o escribe a', contact_priv: 'Usaremos tus datos solo para responderte.' },
  en: { year: 'Earth year:', lap: 'Current lap:', lap_n: 'lap', speed: 'Speed', light: 'Light', trails: 'Spiral trail', orbits: 'Orbits', language: 'Language',
    pause: '⏸ Pause', resume: '▶ Resume', pause_title: 'Pause / resume (space)', ships: 'Ships', show_ships: 'Show ships', others: 'Others', search_ph: 'Search ship…',
    locate: 'Locate', see: 'Show', orbiting: 'Orbiting', traveling: 'Traveling from', to: 'to', parked: 'Parked (slow orbit) near', au_sun: 'AU from the Sun',
    hint: 'Drag: rotate · Wheel: zoom · Click a planet: see its lap · Click a ship: follow it (Esc: release)',
    contact_btn: 'Contact the creator team', contact_title: 'Contact the creator team', contact_note: 'All fields are required (*).',
    f_name: 'Name', f_mail: 'Email', f_msg: 'Message', send: 'Send', sending: 'Sending…', cancel: 'Cancel', close: 'Close',

};
const NAME_EN = { Sol: 'Sun', Mercurio: 'Mercury', Tierra: 'Earth', Luna: 'Moon', Marte: 'Mars', Fobos: 'Phobos', 'Júpiter': 'Jupiter', 'Ío': 'Io', Ganímedes: 'Ganymede', Calisto: 'Callisto',
  Saturno: 'Saturn', Rea: 'Rhea', 'Titán': 'Titan', 'Jápeto': 'Iapetus', Urano: 'Uranus', 'Oberón': 'Oberon', Neptuno: 'Neptune', 'Tritón': 'Triton', 'Plutón': 'Pluto', Caronte: 'Charon' };
const SHIP_EN = {   // id → [nombre, obra] en inglés
  falcon: ['Millennium Falcon', 'Star Wars'], xwing: ['X-Wing "Red Five" (Luke Skywalker)', 'Star Wars'], ywing: ['Y-Wing', 'Star Wars'], awing: ['A-Wing', 'Star Wars'], slave1: ['Slave I (Boba Fett)', 'Star Wars'],
  lambda: ['Imperial Lambda-class shuttle', 'Star Wars'], deathstar: ['Death Star', 'Star Wars'], destroyer: ['Imperial Star Destroyer (with TIE fighters)', 'Star Wars'], rebels: ['Rebel fleet (X-Wings and Y-Wings)', 'Star Wars'],
  enterpriseD: ['USS Enterprise NCC-1701-D', 'Star Trek: The Next Generation'], enterpriseA: ['USS Enterprise NCC-1701 (refit)', 'Star Trek (films)'], bop: ['Klingon Bird of Prey', 'Star Trek III-VI'], voyager: ['USS Voyager', 'Star Trek: Voyager'],
  galactica: ['Battlestar Galactica (with Colonial Vipers)', 'Battlestar Galactica'], raiders: ['Cylon Raiders', 'Battlestar Galactica'], nostromo: ['Nostromo', 'Alien'], sulaco: ['Sulaco', 'Aliens'],
  et: ["E.T.'s ship", 'E.T. the Extra-Terrestrial'], alf: ["ALF's ship (Melmac)", 'ALF'], delorean: ['Flying DeLorean', 'Back to the Future Part II'], eagle5: ['Eagle 5', 'Spaceballs'], spaceball1: ['Spaceball One', 'Spaceballs'],
  mothership: ['Mothership (with attack fighters)', 'Independence Day'], sdf1: ['SDF-1 Macross', 'Macross / Robotech'], ark: ['Autobot Ark', 'Transformers'], heartofgold: ['Heart of Gold', "The Hitchhiker's Guide to the Galaxy"],
  liberator: ['Liberator', "Blake's 7"], buck: ['Buck Rogers Starfighter', 'Buck Rogers in the 25th Century'], mondo: ['Mondoshawan ship', 'The Fifth Element'], starbug: ['Starbug (Red Dwarf)', 'Red Dwarf'],
  zathura: ["Zathura's house", 'Zathura: A Space Adventure'], zorgon: ['Zorgon ship', 'Zathura: A Space Adventure'], predator: ['Predator ship', 'Predator'], prometheus: ['Prometheus', 'Prometheus'],

let LANG = (() => {
  try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'es' || q === 'en') return q; const v = localStorage.getItem('lang'); if (v === 'es' || v === 'en') return v; } catch (e) { /* sin almacenamiento */ }
  return (navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en';
})();
const t = k => (STR[LANG] && STR[LANG][k]) || STR.es[k] || k;
const nm = n => (LANG === 'en' && NAME_EN[n]) || n;
const shipName = d => (LANG === 'en' && SHIP_EN[d.id]) ? SHIP_EN[d.id][0] : d.name;
const shipWork = d => (LANG === 'en' && SHIP_EN[d.id]) ? SHIP_EN[d.id][1] : d.work;
const shipLabel = e => `${shipName(e.def)} — ${shipWork(e.def)} (${e.def.year})`;
const ROT_SECONDS_PER_HOUR = 0.5; // 1 h real de rotación = 0,5 s de reloj (a x1)
/* Avance del sistema: el Sol se desplaza por la galaxia y arrastra a los planetas, así que en 3D
   cada uno traza una hélice. Velocidad muy exagerada (unidades de escena por segundo simulado);
   con 0,2 u/s una vuelta de la Tierra avanza 12 u. Las estelas se dibujan en el espacio fijo. */
const DRIFT = 0.2;
const TRAIL_SECONDS = 120;   // duración de la estela (2 años terrestres)
const TRAIL_DT = 0.25;       // un punto cada 0,25 s simulados
const TRAIL_CAP = Math.round(TRAIL_SECONDS / TRAIL_DT);
const orbitRadius = au => 10 + 16 * Math.sqrt(au);

const BODIES = [
  { name: 'Mercurio', radius: 0.55, au: 0.387, period: 0.241, trail: '#b8a898', rotHours: 1407.6, tilt: 0,
    tex: { type: 'rock', base: [150, 140, 130], vary: 0.35 } },
  { name: 'Venus', radius: 1.0, au: 0.723, period: 0.615, trail: '#e6c888', rotHours: -5832.5, tilt: 3,
    tex: { type: 'rock', base: [222, 190, 130], vary: 0.12, freq: 3 } },
  { name: 'Tierra', radius: 1.05, au: 1.0, period: 1.0, trail: '#6aa8ff', rotHours: 23.93, tilt: 23.4,
    tex: { type: 'earth' },
    moons: [
      { name: 'Luna', radius: 0.3, orbit: 2.0, period: 5, tex: { type: 'rock', base: [175, 175, 172], vary: 0.4 } },
    ] },
  { name: 'Marte', radius: 0.75, au: 1.524, period: 1.881, trail: '#e8785a', rotHours: 24.62, tilt: 25,
    tex: { type: 'mars' },
    moons: [
      { name: 'Fobos', radius: 0.14, orbit: 1.3, period: 3, tex: { type: 'rock', base: [130, 115, 100], vary: 0.3 } },
      { name: 'Deimos', radius: 0.11, orbit: 1.9, period: 6, tex: { type: 'rock', base: [150, 135, 120], vary: 0.3 } },
    ] },
  { name: 'Júpiter', radius: 4.0, au: 5.203, period: 11.86, trail: '#e8b88a', rotHours: 9.93, tilt: 3,
    tex: { type: 'bands', pal: ['#d8c3a5', '#b5835a', '#ecdfc8', '#a8693f', '#e4d4ba', '#c08a5a', '#efe3d0', '#9c6a45', '#d9c5a7'], turb: 1.0, spot: true },
    moons: [
      { name: 'Ío', radius: 0.35, orbit: 5.4, period: 3, tex: { type: 'rock', base: [225, 200, 110], vary: 0.3 } },
      { name: 'Europa', radius: 0.32, orbit: 6.6, period: 5, tex: { type: 'rock', base: [215, 205, 190], vary: 0.15 } },
      { name: 'Ganímedes', radius: 0.5, orbit: 8.0, period: 8.5, tex: { type: 'rock', base: [150, 135, 120], vary: 0.35 } },
      { name: 'Calisto', radius: 0.45, orbit: 9.6, period: 14, tex: { type: 'rock', base: [95, 85, 78], vary: 0.35 } },
    ] },
  { name: 'Saturno', radius: 3.4, au: 9.537, period: 29.46, trail: '#ecd694', rotHours: 10.66, tilt: 26.7,
    tex: { type: 'bands', pal: ['#e6d3a3', '#d2b97f', '#eadcb4', '#c9ad78', '#e3d1a0', '#d6bf8c'], turb: 0.5 },
    rings: { inner: 4.4, outer: 7.8 }, eqMoons: true,
    moons: [

   ===================================================================== */
function hash(x, y, s) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s + 1, 2147483629);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
// Ruido de valor periódico en X (px = periodo entero) → textura sin costura.
function vnoise(x, y, px, s) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const x0 = ((xi % px) + px) % px, x1 = (x0 + 1) % px;
  const a = hash(x0, yi, s), b = hash(x1, yi, s), c = hash(x0, yi + 1, s), d = hash(x1, yi + 1, s);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
function fbm(x, y, px, s, oct) {
  let sum = 0, amp = 0.5, tot = 0, f = 1;
  for (let o = 0; o < oct; o++) { sum += amp * vnoise(x * f, y * f, px * f, s + o); tot += amp; amp *= 0.5; f *= 2; }
  return sum / tot;
}
function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const clamp01 = v => Math.max(0, Math.min(1, v));

function paint(w, h, fn) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(w, h), d = img.data;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const c = fn(i / w, j / h), k = (j * w + i) * 4;
    d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = c.length > 3 ? c[3] : 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv);
  t.anisotropy = 4;
  return t;
}

let seedCounter = 1;
function makeTexture(spec) {
  const seed = seedCounter++ * 17;
  switch (spec.type) {
    case 'rock': {
      const base = spec.base, vr = spec.vary, f = spec.freq || 4;
      return paint(256, 128, (u, v) => {
        const n = fbm(u * f, v * f / 2, f, seed, 5), m = fbm(u * f * 3, v * f * 1.5, f * 3, seed + 9, 3);
        const k = 1 + (n - 0.5) * 2 * vr + (m - 0.5) * vr * 0.8;
        return [base[0] * k, base[1] * k, base[2] * k];
      });
    }
    case 'earth':
      return paint(512, 256, (u, v) => {
        const h = fbm(u * 5, v * 2.5, 5, seed, 6), pole = Math.abs(v - 0.5) * 2;
        if (pole > 0.86 + (fbm(u * 8, 0, 8, seed + 3, 3) - 0.5) * 0.1) return [236, 242, 248];
        if (h > 0.52) {
          const dry = fbm(u * 6, v * 3, 6, seed + 5, 4);
          return mix([62, 130, 66], [168, 146, 92], clamp01((dry - 0.4) * 3 + pole * 0.4));
        }
        return mix([18, 56, 130], [34, 96, 172], clamp01((h - 0.2) * 3));
      });
    case 'mars':
      return paint(256, 128, (u, v) => {
        const n = fbm(u * 5, v * 2.5, 5, seed, 5), pole = Math.abs(v - 0.5) * 2;
        if (pole > 0.92) return [240, 236, 232];
        return mix([185, 92, 52], [118, 58, 40], clamp01((n - 0.35) * 2.2));
      });
    case 'bands': {
      const pal = spec.pal.map(hex), n = pal.length, turb = spec.turb;
      return paint(512, 256, (u, v) => {
        const t = fbm(u * 6, v * 3, 6, seed, 5);
        let s = v * n + (t - 0.5) * turb * 3.2;
        s = Math.max(0, Math.min(n - 0.001, s));
        const i = Math.floor(s), f = s - i, col = mix(pal[i], pal[Math.min(n - 1, i + 1)], clamp01((f - 0.3) * 1.6));
        let c = col;
        if (spec.spot) { // gran mancha (Júpiter: rojiza; Neptuno: oscura)
          const dx = (u - 0.3) / 0.07, dy = (v - 0.62) / 0.045, q = dx * dx + dy * dy;
          if (q < 1) c = mix(c, spec.spot === 'dark' ? [20, 35, 110] : [190, 95, 60], (1 - q) * 0.85);
        }
        return c;
      });
    }
    case 'sun': // fotosfera: naranja con granulado suave, nunca blanco
      return paint(512, 256, (u, v) => {
        const n = fbm(u * 6, v * 3, 6, seed, 6), g = fbm(u * 24, v * 12, 24, seed + 4, 3);
        const k = clamp01((n - 0.3) * 1.6 + (g - 0.5) * 0.35);
        return mix([214, 104, 26], [244, 170, 56], k);
      });
  }
}

function makeGlowTexture() {
  const s = 256, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const ctx = cv.getContext('2d'), g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0.00, 'rgba(255,160,60,0.55)');
  g.addColorStop(0.45, 'rgba(255,140,40,0.30)');
  g.addColorStop(0.70, 'rgba(255,110,30,0.10)');
  g.addColorStop(1.00, 'rgba(255,100,20,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
  return new THREE.CanvasTexture(cv);
}

function makeRingTexture() {
  return paint(512, 4, (u) => {
    // bandas de densidad con una división tipo Cassini hacia el 62 %
    let a = 0.5 + 0.35 * fbm(u * 40, 0.5, 40, 77, 4) + 0.15 * Math.sin(u * 60);
    if (u > 0.60 && u < 0.66) a *= 0.12;
    if (u < 0.08) a *= u / 0.08;           // borde interior difuso
    if (u > 0.95) a *= (1 - u) / 0.05;     // borde exterior difuso
    return [218, 200, 165, clamp01(a) * 255 * 0.8];
  });
}

(function makeStars() {
  const N = 2600, pos = new Float32Array(N * 3), size = new Float32Array(N), phase = new Float32Array(N), tw = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = Math.sqrt(1 - u * u), R = 1500 + Math.random() * 300;
    pos.set([r * Math.cos(a) * R, u * R, r * Math.sin(a) * R], i * 3);

  }

  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  g.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));

  const m = new THREE.ShaderMaterial({
    uniforms: starUniforms, transparent: true, depthWrite: false,

function orbitLine(radius, color, opacity, parent) {
  const pts = [];
  for (let i = 0; i <= 256; i++) { const a = i / 256 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, -Math.sin(a) * radius)); }
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: false }));
  parent.add(line); orbitLines.push(line);
  return line;
}

  tiltG.rotation.z = THREE.MathUtils.degToRad(b.tilt);

  tiltG.add(mesh);                                  // el mesh es el que gira

  const moons = (b.moons || []).map((m, mi) => {

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));

  out[i] = Math.cos(ang) * t.orbitR; out[i + 1] = DRIFT * simT; out[i + 2] = -Math.sin(ang) * t.orbitR;

  while (trailT + TRAIL_DT <= simT) {

    for (const t of trails) {

      trailPoint(t, trailT, t.pos, t.count * 3); t.count++;
    }
  }
  for (const t of trails) {
    trailPoint(t, simT, t.pos, t.count * 3);          // último vértice = posición actual
    const n = t.count + 1;
    for (let i = 0; i < n; i++) { const k = Math.pow(i / (n - 1), 1.6) * 0.5; t.col[i * 3] = t.tint.r * k; t.col[i * 3 + 1] = t.tint.g * k; t.col[i * 3 + 2] = t.tint.b * k; }

}

/* =====================================================================
   NAVES — 2. CONSTRUCTORES DE MODELOS (solo primitivas y colores sólidos)
   Cada modelo se escribe con el morro hacia +Z, se fusiona en UNA geometría con colores por
   vértice (1 draw call por nave) y se normaliza a longitud máxima 1 y centro en el origen;
   luego se escala con size·SHIP_VIS. Los motores («engines») son brillos aditivos.
   ===================================================================== */
const BLUE = '#6fb4ff', ORANGE = '#ff9d4d', REDG = '#ff5a4a', GREENG = '#7dff9a', CYAN = '#8fe8ff', PINK = '#ff8fd0';

function wedgeGeo(w, h, l) { // cuña plana: morro en +Z, cresta trasera elevada
  const N = [0, 0, l / 2], RL = [-w / 2, 0, -l / 2], RR = [w / 2, 0, -l / 2], Tp = [0, h, -l * 0.3];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([N, RR, RL, N, RL, Tp, N, Tp, RR, RL, RR, Tp].flat(), 3));
  g.computeVertexNormals();
  return g;
}

/* Fusiona las partes en una única BufferGeometry con color por vértice y la normaliza. */
const modelCache = {};
function getModel(key) {

  const spec = MODELS[key](), pos = [], nor = [], col = [], c = new THREE.Color();
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), s = new THREE.Vector3();
  for (const pt of spec.parts) {

    e.set(pt.r[0], pt.r[1], pt.r[2]); q.setFromEuler(e);
    const sc = typeof pt.s === 'number' ? [pt.s, pt.s, pt.s] : pt.s;
    m.compose(p.set(pt.p[0], pt.p[1], pt.p[2]), q, s.set(sc[0], sc[1], sc[2])); g.applyMatrix4(m);
    c.set(pt.color);

    for (let i = 0; i < P.length; i += 3) { pos.push(P[i], P[i + 1], P[i + 2]); nor.push(N[i], N[i + 1], N[i + 2]); col.push(c.r, c.g, c.b); }
    pt.geo.dispose(); g.dispose();

  for (let i = 0; i < pos.length; i += 3) for (let k = 0; k < 3; k++) pos[i + k] = (pos[i + k] - ctr[k]) / dim;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const engines = spec.engines.map(en => ({ p: new THREE.Vector3(en.p[0] - ctr[0], en.p[1] - ctr[1], en.p[2] - ctr[2]).divideScalar(dim), s: en.s / dim, c: en.c }));
  return (modelCache[key] = { geo, engines });
}

function slotOffset(form, j, cap, sp, capLen, total) {

    const r = cap ? capLen * rand(0.8, 1.4) + sp : sp * rand(0.7, 2.4) * (1 + total * 0.05);
    return new THREE.Vector3(Math.sin(th) * Math.cos(ph) * r * 1.2, Math.cos(th) * r * 0.45, Math.sin(th) * Math.sin(ph) * r * 1.1);
  }

  const k = cap ? Math.floor(j / 2) + 1 : Math.ceil(j / 2), side = j % 2 ? 1 : -1;

    }

    const f = def.fleet, cap = !!def.model, total = f.members.reduce((a, m) => a + m.n, 0);

function updateShipTrails(t) {

      tr.pos[tr.count * 3] = e.pos.x; tr.pos[tr.count * 3 + 1] = e.pos.y; tr.pos[tr.count * 3 + 2] = e.pos.z; tr.count++;
    }
    const n = tr.count + 1;                           // último vértice = posición actual
    tr.pos[tr.count * 3] = e.pos.x; tr.pos[tr.count * 3 + 1] = e.pos.y; tr.pos[tr.count * 3 + 2] = e.pos.z;
    for (let i = 0; i < n; i++) { const k = Math.pow(i / Math.max(1, n - 1), 1.5) * 0.55; tr.col[i * 3] = tr.tint.r * k; tr.col[i * 3 + 1] = tr.tint.g * k; tr.col[i * 3 + 2] = tr.tint.b * k; }

function bez(a, b, c, d, s, out) {

}
function sunClearance(a, b, c, d) { let m = Infinity; for (let i = 0; i <= 32; i++) m = Math.min(m, bez(a, b, c, d, i / 32, _b).length()); return m; }

}

function setOrbit(e, tg, t0, end, plane, w, R) {

// Elige destino con un sesgo que reparte las naves (menos peso donde ya hay otras)
function chooseDest(e) {
  const occ = new Map();
  for (const s of ships) { if (s === e) continue; const tg = s.state === 'orbit' ? s.orb.target : s.state === 'travel' ? s.tr.dest : null; if (tg) occ.set(tg, (occ.get(tg) || 0) + 1); }
  let sum = 0; const ws = TARGETS.map(tg => { const w = tg === e.orb.target ? 0 : tg.w / (1 + 1.8 * (occ.get(tg) || 0)); sum += w; return w; });
  let r = Math.random() * sum;
  for (let i = 0; i < TARGETS.length; i++) { r -= ws[i]; if (r <= 0) return TARGETS[i]; }

}

function beginTravel(e, t) {

function updateShip(e, t) {

      const est = o.dest.pos(t + 20, _c).sub(e.pos).normalize();

/* Estado inicial: cada nave empieza orbitando un planeta distinto (reparto aleatorio); la estación, en órbita lenta */
function initShips() {

  const order = shuffle(PLANET_TARGETS).concat(shuffle(TARGETS.filter(t => t.isMoon)));   // primero planetas, luego lunas: poca coincidencia inicial
  ships.forEach((e, i) => {
    if (e.def.kind === 'station') { e.state = 'parked'; e.park = { R: 70, w: TAU / 420, ph: rand(0, TAU) }; }
    else {

/* ---- Marcadores: punto brillante por nave, más grande cuanto más lejos está la cámara,
        y que se desvanece al acercarse (cuando la nave ya se ve por sí misma) ---- */
const markerU = { uFocal: { value: 600 }, uPx: { value: 1 } };
const markers = (() => {
  const n = ships.length, pos = new Float32Array(n * 3), colA = new Float32Array(n * 3), size = new Float32Array(n), vis = new Float32Array(n);
  ships.forEach((e, i) => { const c = new THREE.Color(e.def.color); colA.set([c.r, c.g, c.b], i * 3); size[i] = Math.max(e.len, e.extent * 1.2); vis[i] = 1; });

/* =====================================================================

   ===================================================================== */
const cam = { theta: 0.5, phi: THREE.MathUtils.degToRad(90 - 57), dist: 250 };  // 57° sobre el plano orbital
const camT = { ...cam };
const pointers = new Map(), downPos = new Map();
let selected = null; // planeta seleccionado (def de BODIES)
// Seguimiento: el objetivo de la cámara es ancla (Sol o nave) + un desfase que decae, así el seguimiento es exacto sin retraso
const camOff = new THREE.Vector3(), camTarget = new THREE.Vector3();
let following = null, flyUntil = 0, minDist = 14, homeDist = 250;
function anchorPos(ent, out) { return ent ? out.copy(ent.pos).add(root.position) : out.set(0, root.position.y, 0); }
function setFollow(ent) {
  if (ent === following) { if (ent) { camT.dist = ent.followDist; flyUntil = performance.now() + 1800; } return; }
  camOff.add(anchorPos(following, new THREE.Vector3())).sub(anchorPos(ent, new THREE.Vector3()));
  following = ent; flyUntil = performance.now() + 1800;

    row.querySelector('[data-act="loc"]').textContent = t('locate'); row.querySelector('[data-act="see"]').textContent = t('see'); row.lastStat = '';
  }
  secBySaga.otras.querySelector('h4').textContent = t('others');
  $('cSend').textContent = sendingNow ? t('sending') : t('send'); $('cCancel').textContent = t('cancel');
  for (const id of ['eName', 'eMail', 'eMsg']) $(id).textContent = '';
  $('cStatus').textContent = '';
  $('lang').value = LANG; lastMenu = 0;
}
function setLang(l) { if (l !== 'es' && l !== 'en') return; LANG = l; try { localStorage.setItem('lang', l); } catch (e) { /* sin almacenamiento */ } applyLang(); }
$('lang').addEventListener('change', e => setLang(e.target.value));

/* =====================================================================
   CONTACTO: botón «Matrix» + formulario (Nombre, Mail y Mensaje obligatorios)
   El envío usa FormSubmit (servicio de formularios sin servidor propio): reenvía el mensaje por mail.
   Para cambiar de servicio o de destinatario basta con editar estas dos constantes.
   ===================================================================== */
const CONTACT_EMAIL = 'bernardofoco@gmail.com';
const CONTACT_ENDPOINT = 'https://formsubmit.co/ajax/' + CONTACT_EMAIL;
const cModal = $('contactModal'), cForm = $('cForm'), cStatus = $('cStatus'), cSend = $('cSend'), rainCv = $('rain');
let contactOpen = false, sendingNow = false, cLastFocus = null, rainRaf = 0, rainLast = 0, rainDrops = [];
const RAIN_CH = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ0123456789:.=*+-<>';
function rainFrame(ts) {
  rainRaf = requestAnimationFrame(rainFrame);
  if (ts - rainLast < 60) return; rainLast = ts;
  const ctx = rainCv.getContext('2d');
  ctx.fillStyle = 'rgba(0, 10, 0, 0.14)'; ctx.fillRect(0, 0, rainCv.width, rainCv.height);
  ctx.fillStyle = '#00ff41'; ctx.font = '14px monospace';
  for (let i = 0; i < rainDrops.length; i++) {
    ctx.fillText(RAIN_CH[(Math.random() * RAIN_CH.length) | 0], i * 14, rainDrops[i] * 14);
    rainDrops[i] = rainDrops[i] * 14 > rainCv.height && Math.random() > 0.975 ? 0 : rainDrops[i] + 1;
  }
}
function openContact() {
  cLastFocus = document.activeElement; contactOpen = true; cModal.hidden = false;
  const box = cModal.querySelector('.cbox'); rainCv.width = box.clientWidth; rainCv.height = box.clientHeight;
  rainDrops = Array.from({ length: Math.ceil(rainCv.width / 14) }, () => (Math.random() * 30) | 0);
  rainRaf = requestAnimationFrame(rainFrame); $('cName').focus();
}
function closeContact() {
  contactOpen = false; cModal.hidden = true; cancelAnimationFrame(rainRaf);
  if (cLastFocus && cLastFocus.focus) cLastFocus.focus();
}
$('contact').addEventListener('click', openContact);
$('cClose').addEventListener('click', closeContact); $('cCancel').addEventListener('click', closeContact);
cModal.addEventListener('mousedown', e => { if (e.target === cModal) closeContact(); });
cModal.addEventListener('keydown', e => {          // el foco no sale del formulario mientras está abierto
  if (e.key !== 'Tab') return;
  const f = [...cModal.querySelectorAll('input:not(.hp), textarea, button:not(:disabled)')];
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
});
function fieldError(inputId, errId, msg) { $(inputId).setAttribute('aria-invalid', msg ? 'true' : 'false'); $(errId).textContent = msg ? t(msg) : ''; return !!msg; }
cForm.addEventListener('submit', async ev => {
  ev.preventDefault(); if (sendingNow) return;
  const v = { name: $('cName').value.trim(), email: $('cMail').value.trim(), message: $('cMsg').value.trim() };
  const eName = fieldError('cName', 'eName', v.name.length < 1 ? 'err_name' : ''),
    eMail = fieldError('cMail', 'eMail', /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email) ? '' : 'err_mail'),
    eMsg = fieldError('cMsg', 'eMsg', v.message.length < 10 ? 'err_msg' : '');
  if (eName || eMail || eMsg) { $(eName ? 'cName' : eMail ? 'cMail' : 'cMsg').focus(); return; }
  cStatus.textContent = '';
  if ($('cHoney').value) { cStatus.textContent = t('ok'); cForm.reset(); return; }   // campo trampa: un robot lo rellena
  sendingNow = true; cSend.disabled = true; cSend.textContent = t('sending');
  try {
    const r = await fetch(CONTACT_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ name: v.name, email: v.email, message: v.message, _subject: 'Sistema Solar Pop — contacto / contact', _template: 'table', _captcha: 'false' }) });
    const d = await r.json().catch(() => ({}));
    if (!(r.ok && (d.success === true || d.success === 'true'))) { const er = new Error(d.message || ('HTTP ' + r.status)); er.activation = /activat/i.test(d.message || ''); throw er; }
    cStatus.textContent = t('ok'); cForm.reset();
  } catch (err) {                                   // fallo de red o del servicio: se ofrece el correo directo
    if (err.activation) { cStatus.textContent = t('activate'); return; }   // primer envío: FormSubmit pide activar el destinatario
    cStatus.textContent = t('fail') + ' ';
    const a = document.createElement('a'); a.href = `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent('Sistema Solar Pop')}&body=${encodeURIComponent(v.message)}`; a.textContent = CONTACT_EMAIL; cStatus.appendChild(a);
  } finally { sendingNow = false; cSend.disabled = false; cSend.textContent = t('send'); }
});
applyLang();

/* =====================================================================
   BUCLE: tiempo por reloj real (performance.now), no por frames
   ===================================================================== */
let simSeconds = 0;               // segundos simulados a x1; 1 año terrestre = 60 s
let last = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 1); last = now;   // tope 1 s si la pestaña estuvo oculta
  if (!paused) simSeconds += dt * speed;
  const years = simSeconds / EARTH_YEAR_SECONDS;

  root.position.y = DRIFT * simSeconds;           // el sistema avanza
  starsObj.position.y = root.position.y * 0.985;    // fondo casi fijo, con un mínimo de paralaje
  sunMesh.rotation.y = simSeconds * TAU / (SUN.rotHours * ROT_SECONDS_PER_HOUR);
  for (const p of planets) {
    const d = p.def, ang = p.phase + TAU * years / d.period;
    p.pivot.position.set(Math.cos(ang) * d.orbitR, 0, -Math.sin(ang) * d.orbitR);
    p.mesh.rotation.y = simSeconds * TAU / d.rot;
    for (const m of p.moons) {
      const a = m.phase + TAU * simSeconds / m.def.period;
      m.mesh.position.set(Math.cos(a) * m.def.orbit, 0, -Math.sin(a) * m.def.orbit);
      m.mesh.rotation.y = a; // rotación síncrona
    }
  }

  updateShips(simSeconds, dt, now);

  // cámara suavizada; acompaña al Sol o a la nave seguida (más lenta durante el vuelo de «Localizar»)
  const rate = now < flyUntil ? 3.2 : 12, k = 1 - Math.exp(-dt * rate);
  cam.theta += (camT.theta - cam.theta) * k; cam.phi += (camT.phi - cam.phi) * k; cam.dist += (camT.dist - cam.dist) * k;
  camOff.multiplyScalar(1 - k);
  camTarget.copy(anchorPos(following, _tp)).add(camOff);
  camera.position.set(
    camTarget.x + cam.dist * Math.sin(cam.phi) * Math.sin(cam.theta),
    camTarget.y + cam.dist * Math.cos(cam.phi),
    camTarget.z + cam.dist * Math.sin(cam.phi) * Math.cos(cam.theta));
  camera.lookAt(camTarget);
  camera.near = clampN(cam.dist * 0.04, 0.004, 0.5);   // plano cercano adaptado al zoom: permite ver las naves de cerca
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();

  updateTrails(simSeconds);
  updateShipTrails(simSeconds); updateMarkers(); updateHighlight(now); refreshMenu(now, simSeconds);
  starUniforms.uTime.value = now / 1000;
  updateHover();

  const yr = Math.floor(years), frac = years - yr;
  $('year').textContent = yr + 1;
  $('lap').textContent = Math.floor(frac * 100) + '%';
  $('barfill').style.width = (frac * 100).toFixed(1) + '%';

  const sel = $('sel');
  if (selected) {
    const f = years / selected.period; // vueltas completadas (mismo criterio que la Tierra)
    const fr = f - Math.floor(f);
    sel.style.display = 'block';
    $('selname').textContent = nm(selected.name) + ' · ' + t('lap_n') + ' ' + (Math.floor(f) + 1);
    $('sellap').textContent = (Math.floor(fr * 1000) / 10).toFixed(1) + '%'; // 1 decimal: Saturno avanza ~0,1 % por segundo
    $('selfill').style.width = (fr * 100).toFixed(1) + '%';
  } else sel.style.display = 'none';

  renderer.render(scene, camera);
}

/* ---- Redimensionado (DPR máx. 2) ---- */
function resize() {
  viewW = innerWidth; viewH = innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(viewW, viewH, false);
  camera.aspect = viewW / viewH; camera.updateProjectionMatrix();
  starUniforms.uPx.value = dpr;
  markerU.uPx.value = dpr; markerU.uFocal.value = (viewH / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
}
addEventListener('resize', resize);
resize();
{ // distancia inicial para encajar Plutón en pantalla
  const rMax = BODIES[BODIES.length - 1].orbitR * 1.12, t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  cam.dist = camT.dist = homeDist = clampDist(Math.max(rMax * 0.85 / t, rMax / (t * camera.aspect)));
}

// API mínima para pruebas automáticas
window.__solar = {
  earthAngle: () => { const e = planets.find(p => p.def.name === 'Tierra'); return e.phase + TAU * (simSeconds / EARTH_YEAR_SECONDS); },
  screenPos: name => { const t = hitTargets.find(h => h.name === name); const s = screenInfo(t); return { x: s.x, y: s.y, r: s.r }; },
  ships: shipById, setFollow: id => setFollow(id ? shipById[id] : null),
  shipScreen: id => { const e = shipById[id], s = screenInfo({ obj: e.group, radius: e.hitR }); return { x: s.x, y: s.y, r: s.r }; },
  shipInfo: id => { const e = shipById[id]; return { state: e.state, target: e.state === 'orbit' ? e.orb.target.name : e.state === 'travel' ? e.tr.dest.name : null, pos: e.pos.toArray(), visible: e.visible }; },
  camInfo: () => ({ dist: cam.dist, follow: following && following.id, toShip: following ? camera.position.distanceTo(anchorPos(following, new THREE.Vector3())) : null }),
  sunMin: () => sunMin, renderInfo: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
  setLang, getLang: () => LANG, setPaused, select: n => { selected = BODIES.find(b => b.name === n) || null; }, hitTargets: () => hitTargets.map(h => h.name),
};
requestAnimationFrame(t => { last = t; frame(t); });
</script>
